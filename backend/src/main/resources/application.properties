spring.application.name=backend
server.port=${PORT:8080}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
app.redis.enabled=${APP_REDIS_ENABLED:false}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coshop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

app.mail.from=${APP_MAIL_FROM:}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

app.sms.twilio.account-sid=${APP_SMS_TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${APP_SMS_TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${APP_SMS_TWILIO_FROM_NUMBER:}
app.sms.twilio.verify-service-sid=${APP_SMS_TWILIO_VERIFY_SERVICE_SID:}

app.extension.api-key=${APP_EXTENSION_API_KEY:}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,chrome-extension://*}
