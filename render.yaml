services:
  - type: web
    name: coshop-backend
    env: java
    rootDir: backend
    autoDeploy: true
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        sync: false
      - key: APP_EXTENSION_API_KEY
        sync: false
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
      - key: APP_MAIL_FROM
        sync: false
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: APP_SMS_TWILIO_ACCOUNT_SID
        sync: false
      - key: APP_SMS_TWILIO_AUTH_TOKEN
        sync: false
      - key: APP_SMS_TWILIO_FROM_NUMBER
        sync: false
      - key: APP_SMS_TWILIO_VERIFY_SERVICE_SID
        sync: false
